test_file: test_file.h5 # hdf5 containing data to test models on 
norm_dict: norm_dict.yaml # norm dictionary of variables created by 
sample_size: N # number of data points to running inference on
stored: GN2v01 # model output stored in test file, should be GN2v01
low_pt_cutoff: 20000 # pt cutoffs
high_pt_cutoff: 250000

models:
  model_name_1:
    model_checkpoint: path_to_checkpoint.ckpt  
    inference_variables: # variables model requires to run inference on
      jets:
        - variable_1
        - variable_2
        - ..
      tracks:
        - variable_1
        - variable_2
        - ..
      other_h5_group_name:
        - variable_1
        - ..

  model_name_2:
    model_checkpoint: path_to_checkpoint.ckpt  
    inference_variables: # variables model requires to run inference on
      jets:
        - variable_1
        - variable_2
        - ..
      tracks:
        - variable_1
        - variable_2
        - ..
      other_h5_group_name:
        - variable_1
        - ..
