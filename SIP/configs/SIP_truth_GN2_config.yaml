
test_file: truth_regression_model/pp_output_test_ttbar.h5 # hdf5 containing data to test models on 
norm_dict: norm_dict.yaml # norm dictionary of variables created by 
sample_size: 10000 # number of data points to running inference on
stored: GN2v01 # model output stored in test file, should be GN2v01
low_pt_cutoff: 20000 # pt cutoffs
high_pt_cutoff: 250000

models:
  truth_classification_model:
    model_checkpoint: ckpts/epoch=013-val_loss=0.62472.ckpt  
    plot_colour: "tab:blue"
    inference_variables: # variables model requires to run inference on
      jets:
        - pt_btagJes
        - eta_btagJes
      truth_hadrons:
        - pdgId
        - pt
        - mass
        - deta
        - dphi
        - decayVertexDPhi
        - decayVertexZ
        - Lxy


  GN2_model:
    model_checkpoint: ckpts/GN2_model_epoch=010-val_loss=0.59503.ckpt
    plot_colour: "tab:orange"
    inference_variables: # variables model requires to run inference on
      jets:
        - pt_btagJes
        - eta_btagJes
      tracks:
        - d0
        - z0SinTheta
        - dphi
        - deta
        - qOverP
        - lifetimeSignedD0Significance
        - lifetimeSignedZ0SinThetaSignificance
        - phiUncertainty
        - thetaUncertainty
        - qOverPUncertainty
        - numberOfPixelHits
        - numberOfSCTHits
        - numberOfInnermostPixelLayerHits
        - numberOfNextToInnermostPixelLayerHits
        - numberOfInnermostPixelLayerSharedHits
        - numberOfInnermostPixelLayerSplitHits
        - numberOfPixelSharedHits
        - numberOfPixelSplitHits
        - numberOfSCTSharedHits
