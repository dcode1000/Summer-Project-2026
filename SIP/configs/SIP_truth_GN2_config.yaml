
test_file: truth_regression_model/pp_output_test_ttbar.h5 # hdf5 containing data to test models on 
norm_dict: norm_dict.yaml # norm dictionary of variables created by 
sample_size: 20000 # number of data points to running inference on
stored: GN2v01 # model output stored in test file, should be GN2v01
low_pt_cutoff: 20000 # pt cutoffs
high_pt_cutoff: 250000

models:
  truth_classification_model:
    model_checkpoint: ckpts/epoch=013-val_loss=0.62472.ckpt  
    inference_task: jets_classification
    inference_output: probs
    inference_variables: # variables model requires to run inference on
      jets:
        - pt_btagJes
        - eta_btagJes
      truth_hadrons:
        - pdgId
        - pt
        - mass
        - deta
        - dphi
        - decayVertexDPhi
        - decayVertexZ
        - Lxy
    plot_colour: "tab:blue"

  truth_regression_model:
    model_checkpoint: ckpts/truth_regression_epoch=018-val_loss=0.51368.ckpt  
    inference_task: jets_prob_regression
    inference_output: scores
    scores_means: [0.22814, 0.24812, 0.38965, 0.13409]
    scores_stds: [0.36566,0.26493,0.36135, 0.27706]
    inference_variables: # variables model requires to run inference on
      jets:
        - pt_btagJes
        - eta_btagJes
      truth_hadrons:
        - pdgId
        - pt
        - mass
        - deta
        - dphi
        - decayVertexDPhi
        - decayVertexZ
        - Lxy
    plot_colour: "tab:green"
    
  GN2_model:
    model_checkpoint: ckpts/GN2_model_epoch=010-val_loss=0.59503.ckpt
    inference_task: jets_classification
    inference_output: probs
    inference_variables: # variables model requires to run inference on
      jets:
        - pt_btagJes
        - eta_btagJes
      tracks:
        - d0
        - z0SinTheta
        - dphi
        - deta
        - qOverP
        - lifetimeSignedD0Significance
        - lifetimeSignedZ0SinThetaSignificance
        - phiUncertainty
        - thetaUncertainty
        - qOverPUncertainty
        - numberOfPixelHits
        - numberOfSCTHits
        - numberOfInnermostPixelLayerHits
        - numberOfNextToInnermostPixelLayerHits
        - numberOfInnermostPixelLayerSharedHits
        - numberOfInnermostPixelLayerSplitHits
        - numberOfPixelSharedHits
        - numberOfPixelSplitHits
        - numberOfSCTSharedHits
    plot_colour: "tab:orange"

inference_report:
  report_title: Comparison of GN2 and Truth Surrogate Models
  plots:
    plot_1:
      plot_type: profile_histogram
      x_data: pt
    plot_2:
      plot_type: profile_histogram
      x_data: eta
    plot_3:
      plot_type: profile_histogram_truth
      x_data: pt
    plot_4:
      plot_type: profile_histogram_truth
      x_data: eta
    plot_5:
      plot_type: prediction_plot
