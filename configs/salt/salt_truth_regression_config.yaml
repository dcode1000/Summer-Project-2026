name: truth_regression_model

model:
  lrs_config:
    initial: 1e-7
    max: 5e-4
    end: 1e-5
    pct_start: 0.01
    weight_decay: 1e-5

  model:
    class_path: salt.models.SaltModel
    init_args:
      init_nets:
        - input_name: tracks
          dense_config:
            output_size: &embed_dim 256
            hidden_layers: [256]
            activation: &activation ReLU
        - input_name: truth_hadrons
          dense_config:
            output_size: *embed_dim
            hidden_layers: [256]
            activation: *activation 

      encoder:
        class_path: salt.models.Transformer
        init_args:
          num_layers: 4
          embed_dim: *embed_dim
          out_dim: &out_dim 128
          # flash attention
          attn_type: flash-varlen
          norm: LayerNorm
          do_final_norm: True
          dense_kwargs:
            activation: *activation
            gated: False
          attn_kwargs:
            num_heads: 8

      pool_net:
        class_path: salt.models.GlobalAttentionPooling
        init_args: { input_size: *out_dim }

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: salt.models.RegressionTask
              init_args:
                name: jets_prob_regression
                input_name: jets
                targets: [GN2v01_pb, GN2v01_pc, GN2v01_pu, GN2v01_ptau]
                norm_params:
                  mean: [1, 1, 1, 1]
                  std: [0, 0, 0, 0]
                loss: 
                  class_path: torch.nn.MSELoss
                dense_config: &task_dense_config
                  input_size: *out_dim
                  output_size: 4
                  hidden_layers: [128, 64, 32]
                  activation: *activation

            - class_path: salt.models.ClassificationTask
              init_args:
                name: track_origin
                input_name: tracks
                label: ftagTruthOriginLabel
                weight: 0.5
                loss:
                  class_path: torch.nn.CrossEntropyLoss
                dense_config:
                  <<: *task_dense_config
                  output_size: 8
                  context_size: *out_dim

            - class_path: salt.models.VertexingTask
              init_args:
                name: track_vertexing
                input_name: tracks
                label: ftagTruthVertexIndex
                weight: 1.5
                loss:
                  class_path: torch.nn.BCEWithLogitsLoss
                  init_args: { reduction: none }
                dense_config:
                  <<: *task_dense_config
                  input_size: 256
                  output_size: 1
                  context_size: *out_dim

data:
  variables:
    jets:
        - pt_btagJes
        - eta_btagJes
    tracks:
        - d0
        - z0SinTheta
        - dphi
        - deta
        - qOverP
        - lifetimeSignedD0Significance
        - lifetimeSignedZ0SinThetaSignificance
    truth_hadrons:
        - pdgId
        - pt
        - mass
        - deta
        - dphi
        - decayVertexDPhi
        - decayVertexZ
        - Lxy
  non_finite_to_num: True

  train_file: /nfs/users/drobbie/dumped_truth/UPP/full_truth/output/pp_output_train.h5
  val_file: /nfs/users/drobbie/dumped_truth/UPP/full_truth/output/pp_output_val.h5
  norm_dict: /nfs/users/drobbie/dumped_truth/UPP/full_truth/output/norm_dict.yaml
  class_dict: /nfs/users/drobbie/dumped_truth/UPP/full_truth/output/class_dict.yaml

  batch_size: 1000
  num_workers: 40

trainer:
  max_epochs: 40
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  callbacks: 
    - class_path: salt.callbacks.Checkpoint
      init_args:
        monitor_loss: val/jets_prob_regression_loss

    - class_path: salt.callbacks.PerformanceWriter
      init_args:
        add_metrics: [train/jets_prob_regression_loss, val/jets_prob_regression_loss]
