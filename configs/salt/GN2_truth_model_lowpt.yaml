name: GN2_truth_model_lowpt

model:
  lrs_config:
    initial: 1e-7
    max: 5e-4
    end: 1e-5
    pct_start: 0.01
    weight_decay: 1e-5

  model:
    class_path: salt.models.SaltModel
    init_args:
      init_nets:
        - input_name: truth_hadrons
          dense_config:
            output_size: &embed_dim 256
            hidden_layers: [256]
            activation: &activation ReLU

      encoder:
        class_path: salt.models.TransformerEncoder
        init_args:
          embed_dim: *embed_dim
          num_layers: 4
          out_dim: &out_dim 128
          mha_config:
            num_heads: 8
            attention: { class_path: salt.models.ScaledDotProductAttention }
          dense_config:
            activation: *activation

      pool_net:
        class_path: salt.models.GlobalAttentionPooling
        init_args: { input_size: *out_dim }

      tasks:
        class_path: torch.nn.ModuleList
        init_args:
          modules:
            - class_path: salt.models.ClassificationTask
              init_args:
                name: jets_classification
                input_name: jets
                label: flavour_label
                use_class_dict: True
                loss: torch.nn.CrossEntropyLoss
                dense_config: &task_dense_config
                  input_size: *out_dim
                  output_size: 4
                  hidden_layers: [128, 64, 32]
                  activation: *activation


data:
  variables:
    jets:
      - pt_btagJes
      - eta_btagJes
    truth_hadrons:
      - pdgId
      - pt
      - mass
      - deta
      - dphi
      - decayVertexDPhi
      - decayVertexZ
      - Lxy

  train_file: /nfs/users/drobbie/dumped_truth/UPP/output/pp_output_train.h5
  val_file: /nfs/users/drobbie/dumped_truth/UPP/output/pp_output_val.h5
  norm_dict: /nfs/users/drobbie/dumped_truth/UPP/output/norm_dict.yaml
  class_dict: /nfs/users/drobbie/dumped_truth/UPP/output/class_dict.yaml

  batch_size: 3000
  num_workers: 40

trainer:
  max_epochs: 40
  accelerator: gpu
  devices: 1
  precision: 16-mixed
