variables:
  jets:
    inputs:
      - pt_btagJes
      - eta_btagJes
    labels:
      - HadronConeExclTruthLabelID
      - HadronConeExclExtendedTruthLabelID
      - HadronGhostTruthLabelID
      - HadronGhostExtendedTruthLabelID
      - pt
      - mass
      - eventNumber
  truth_hadrons:
    inputs:
      - pdgId
      - pt
      - mass
      - deta
      - dphi
      - decayVertexDPhi
      - decayVertexZ
      - Lxy
    labels:
      - ftagTruthParentBarcode

global_cuts:
  train:
    - [eventNumber, "%10<=", 7]
  val:
    - [eventNumber, "%10==", 8]
  test:
    - [eventNumber, "%10==", 9]

ttbar: &ttbar
  name: ttbar
  equal_jets: False
  pattern:
    - "*._002*.h5"
zprime: &zprime
  name: zprime
  equal_jets: False
  pattern: 
    - "*._0009*.h5"

lowpt: &lowpt
  name: lowpt
  cuts:
    - [pt_btagJes, ">", 20_000]
    - [pt_btagJes, "<", 250_000]
highpt: &highpt
  name: highpt
  cuts:
    - [pt_btagJes, ">", 250_000]
    - [pt_btagJes, "<", 6_000_000]

components:
  - region:
      <<: *lowpt
    sample:
      <<: *ttbar
    flavours: [bjets, cjets]
    num_jets: 10_000

  - region:
      <<: *lowpt
    sample:
      <<: *ttbar
    flavours: [ujets]
    num_jets: 20_000

  - region:
      <<: *lowpt
    sample:
      <<: *ttbar
    flavours: [taujets]
    num_jets: 1_000
  
  - region:
      <<: *highpt
    sample:
      <<: *zprime
    flavours: [bjets, cjets]
    num_jets: 10_000

  - region:
      <<: *highpt
    sample:
      <<: *zprime
    flavours: [ujets]
    num_jets: 20_000

  - region:
      <<: *highpt
    sample:
      <<: *zprime
    flavours: [taujets]
    num_jets: 1_000

resampling:
  target: cjets
  method: countup
  sampling_fraction: auto
  variables:
    pt_btagJes:
      bins: [[20_000, 6_000_000, 60]]
    eta_btagJes:
      bins: [[-2.5, 2.5, 40]]

# note: sensible defaults are defined in the PreprocessingConfig constructor
global:
  jets_name: jet
  batch_size: 100_000
  num_jets_estimate: 900_000
  base_dir: /nfs/users/drobbie/dumped_truth/UPP
  ntuple_dir: /nfs/users/drobbie/dumped_truth/dumped_data
